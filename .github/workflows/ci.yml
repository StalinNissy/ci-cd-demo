name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking project files..."
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Build project
        run: |
          echo "Building project..."
          mkdir -p build
          cp index.html style.css script.js build/

      - name: Run tests
        run: |
          echo "Running tests..."
          grep -q "CI/CD" index.html || grep -q "CI" index.html
          test -s build/index.html
          test -s build/style.css
          test -s build/script.js

      - name: CI completed
        run: echo "Build and tests completed successfully!"